<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Generator </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        
        <header>
            <h1 class="glitch" data-text="ASCII GENERATOR">ASCII GENERATOR</h1>
            <p class="tagline">>_ transform text into ASCII art</p>
        </header>

    
        <main>
            
            <div class="input-section">
                <div class="input-header">
                    <span class="prompt-sign">$</span>
                    <span class="prompt-text">enter_text:</span>
                </div>
                <textarea 
                    id="textInput" 
                    placeholder="Type your message here... (max 500 characters)"
                    maxlength="500"
                    rows="4"
                ></textarea>
                <div class="char-counter">
                    <span id="charCount">0</span>/500
                </div>
                
              
                <div class="font-selector">
                    <label for="fontSelect">>_ font_style:</label>
                    <select id="fontSelect">
                        <option value="">random (default)</option>
                        
                    </select>
                </div>

                
                <button id="generateBtn" class="cyber-button">
                    <span class="button-text">GENERATE</span>
                    <span class="button-glitch"></span>
                </button>
            </div>

            
            <div id="loadingOverlay" class="loading-overlay hidden">
                <div class="loading-container">
                    <div class="loading-text">GENERATING ASCII ART</div>
                    <div class="loading-bar-container">
                        <div class="loading-bar"></div>
                    </div>
                    <div class="loading-dots">
                        <span>.</span><span>.</span><span>.</span>
                    </div>
                </div>
            </div>

            
            <div id="outputSection" class="output-section hidden">
                <div class="output-header">
                    <span class="prompt-sign">></span>
                    <span class="prompt-text">output_generated:</span>
                    <div class="output-actions">
                        <button id="saveBtn" class="action-btn" title="Save to TXT">
                            <span>💾</span> SAVE
                        </button>
                        <button id="copyBtn" class="action-btn" title="Copy to Clipboard">
                            <span>📋</span> COPY
                        </button>
                    </div>
                </div>
                <pre id="asciiOutput" class="ascii-art"></pre>
            </div>
        </main>

       
        <footer>
            <div class="matrix-rain"></div>
            <p>© ASCII GENERATOR | MAX 500 CHARACTERS</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
